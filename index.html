
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0F1A">
<title>NEXORA — Les idées connectent le monde</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0F1A;color:white;font-family:Arial,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 7%;border-bottom:1px solid #20283a}
.logo{font-size:27px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#00D4FF,#8A2BE2);color:transparent;background-clip:text}
select{background:#151d2d;color:white;padding:9px;border:1px solid #334155;border-radius:8px}
main{max-width:850px;margin:90px auto;padding:20px;text-align:center}
.tag{color:#00D4FF;border:1px solid #16445c;border-radius:30px;padding:9px 16px;display:inline-block;font-size:12px;letter-spacing:2px}
h1{font-size:clamp(42px,9vw,75px);margin:30px 0 18px;line-height:1.1}
h1 span{background:linear-gradient(90deg,#00D4FF,#8A2BE2);color:transparent;background-clip:text}
.intro{color:#94A3B8;line-height:1.8;max-width:570px;margin:auto}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:35px}
button{padding:15px 24px;border-radius:9px;font-weight:bold;cursor:pointer;border:1px solid #334155;background:transparent;color:white}
.primary{background:linear-gradient(100deg,#00AEEF,#7435D5);border:none}
.bottom{margin-top:85px;color:#64748b;font-size:12px;letter-spacing:2px}
</style>
</head>
<body>
<header>
<div class="logo">NEXORA</div>
<select id="language" onchange="changeLanguage()">
<option value="fr">Français</option>
<option value="en">English</option>
</select>
</header>
<main>
<div class="tag" id="tag">NÉ EN AFRIQUE · CONÇU POUR LE MONDE</div>
<h1 id="title">Les idées se connectent.<br><span>Les solutions émergent.</span></h1>
<p class="intro" id="intro">Chaque grand changement commence par une idée. Connecte ton intelligence au monde, partage ta vision et contribue à construire des solutions qui comptent.</p>
<div class="actions">
<button class="primary" id="discover" onclick="alert('NEXORA arrive bientôt !')">Découvrir NEXORA</button>
<button id="vision" onclick="alert('Notre vision arrive bientôt !')">Notre vision</button>
</div>
<div class="bottom" id="bottom">CONNECTER · CRÉER · TRANSFORMER</div>
</main>
<script>
const translations={
fr:{
tag:"NÉ EN AFRIQUE · CONÇU POUR LE MONDE",
title:"Les idées se connectent.<br><span>Les solutions émergent.</span>",
intro:"Chaque grand changement commence par une idée. Connecte ton intelligence au monde, partage ta vision et contribue à construire des solutions qui comptent.",
discover:"Découvrir NEXORA",vision:"Notre vision",
bottom:"CONNECTER · CRÉER · TRANSFORMER"
},
en:{
tag:"BORN IN AFRICA · BUILT FOR THE WORLD",
title:"Ideas connect.<br><span>Solutions emerge.</span>",
intro:"Every great change begins with an idea. Connect your intelligence with the world, share your vision and help build solutions that matter.",
discover:"Discover NEXORA",vision:"Our vision",
bottom:"CONNECT · CREATE · TRANSFORM"
}
};
function changeLanguage(){
const lang=document.getElementById("language").value;
const t=translations[lang];
document.getElementById("tag").textContent=t.tag;
document.getElementById("title").innerHTML=t.title;
document.getElementById("intro").textContent=t.intro;
document.getElementById("discover").textContent=t.discover;
document.getElementById("vision").textContent=t.vision;
document.getElementById("bottom").textContent=t.bottom;
document.documentElement.lang=lang;
}
</script>
</body>
</html>
